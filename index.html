<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ninjago Minifigure Valuelist</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    To rename the site, just edit the text below — the title is plain
    text on purpose so nobody can change it from the live page.
  -->
  <header class="masthead">
    <h1 class="site-title"><span class="mark">⛩</span> Ninjago Minifigure Valuelist</h1>
    <p class="site-sub">Rarity, value &amp; demand, tracked by set era. Data lives in <code>data.js</code> — this page is read-only.</p>
  </header>

  <nav class="tab-bar">
  <div class="tab-pinned" id="pinnedNav"></div>
  <div class="tab-divider"></div>
  <div class="tab-scroll" id="seasonNav"></div>
</nav>

  <div class="toolbar" id="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8590ac" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Search this tab..." />
    </div>

    <select id="sortSelect">
      <option value="value-desc">Value: High to Low</option>
      <option value="value-asc">Value: Low to High</option>
      <option value="name-asc">Name: A to Z</option>
      <option value="name-desc">Name: Z to A</option>
      <option value="rarity-desc">Rarity: High to Low</option>
      <option value="rarity-asc">Rarity: Low to High</option>
      <option value="demand-desc">Demand: High to Low</option>
      <option value="demand-asc">Demand: Low to High</option>
    </select>

    <select id="rarityFilter">
      <option value="all">All rarities</option>
      <option value="Common">Common</option>
      <option value="Rare">Rare</option>
      <option value="Epic">Epic</option>
      <option value="Legendary">Legendary</option>
      <option value="Mythic">Mythic</option>
    </select>

    <select id="demandFilter">
      <option value="all">All demand</option>
      <option value="Very Low">Very Low</option>
      <option value="Low">Low</option>
      <option value="Average">Average</option>
      <option value="High">High</option>
      <option value="Very High">Very High</option>
    </select>
  </div>

  <main class="grid-wrap" id="content"></main>

  <footer class="site-footer">
    Static site — all data lives in <code>data.js</code>. Edit it and push to GitHub to update the live list.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
